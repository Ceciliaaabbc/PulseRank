spring:
  application:
    name: pulserank
  datasource:
    url: jdbc:mysql://localhost:3306/pulserank?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:pulserank}
    password: ${DB_PASSWORD:pulserank123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: pulserank-rating-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.pulserank.event
        spring.json.value.default.type: com.pulserank.event.RatingSubmittedEvent

server:
  port: 8081

pulserank:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
