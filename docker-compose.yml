services:
  mysql:
    image: mysql:8.0
    container_name: pulserank-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pulserank
      MYSQL_USER: pulserank
      MYSQL_PASSWORD: pulserank123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
